<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff4d6d">
    <title>Bizim Anı Defterimiz ❤️</title>
    <style>
        :root { 
            --primary: #ff4d6d; 
            --accent: #ff758c; 
            --bg: #fff0f3; 
            --text: #4a4a4a; 
            --card-bg: #ffffff;
            --input-bg: #fff5f7;
            --border-color: #ffccd5;
        }
        body.dark-mode {
            --primary: #ff758c; --accent: #ff4d6d; --bg: #1a1a1a;
            --text: #f1f5f9; --card-bg: #2d2d2d; --input-bg: #3d3d3d; --border-color: #444;
        }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); background-attachment: fixed;
            padding-bottom: 60px; color: var(--text); position: relative; min-height: 100vh;
        }
        .hearts-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .heart {
            position: absolute; bottom: -20px; background-color: rgba(255, 77, 109, 0.45);
            display: inline-block; transform: rotate(-45deg); animation: floatUp 6s linear infinite;
        }
        .heart::before, .heart::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background-color: rgba(255, 77, 109, 0.45); border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.6); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(-45deg) scale(1.2); opacity: 0; }
        }
        .header-card { 
            background: linear-gradient(135deg, #ff9a9e 0%, #ff4d6d 99%); 
            color: white; padding: 50px 20px 35px 20px; border-radius: 0 0 35px 35px; 
            text-align: center; box-shadow: 0 10px 25px rgba(255, 77, 109, 0.25); position: relative; z-index: 2; 
        }
        .top-buttons { position: absolute; top: 35px; right: 20px; display: flex; gap: 8px; }
        .icon-btn { background: rgba(255,255,255,0.25); border: none; color: white; font-size: 16px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 100; backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); color: var(--text); width: 100%; max-width: 450px; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; border: 1px solid var(--border-color); z-index: 101; max-height: 90vh; overflow-y: auto; }
        .card { background: var(--card-bg); color: var(--text); padding: 22px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid var(--border-color); position: relative; z-index: 2; }
        .btn-main { background: linear-gradient(135deg, #ff9a9e, #ff4d6d); color: white; border: none; padding: 12px 20px; border-radius: 14px; font-weight: bold; cursor: pointer; display: inline-block; text-decoration: none; text-align: center; width: 100%; box-shadow: 0 4px 12px rgba(255,77,109,0.25); }
        input, textarea, select { width: 100%; padding: 12px 15px; margin: 6px 0 14px 0; border: 1px solid var(--border-color); border-radius: 12px; background: var(--input-bg); box-sizing: border-box; font-family: inherit; font-size: 14px; color: var(--text); outline: none; }
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text); padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .memory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 10px; position: relative; z-index: 2; }
        .memory-card { background: var(--card-bg); color: var(--text); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,0.06); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .bucket-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--input-bg); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
        #secret-trigger { position: fixed; bottom: 5px; right: 5px; width: 30px; height: 30px; cursor: pointer; opacity: 0.03; z-index: 999; }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartsContainer"></div>
    <audio id="bgMusic" loop><source src="" id="musicSource" type="audio/mpeg"></audio>

    <div class="header-card">
        <div class="top-buttons">
            <button class="icon-btn" onclick="toggleTheme()" title="Gece/Gündüz Modu">🌓</button>
            <button class="icon-btn" onclick="toggleMusic()" id="musicBtn" title="Müzik Aç/Kapat">🎵</button>
            <button class="icon-btn" onclick="toggleModal('locationModal', true)" title="Özel Konum Ekle">📍</button>
            <button class="icon-btn" onclick="toggleModal('musicSettingsModal', true)" title="Müzik Dosyası Yükle">⚙️</button>
            <button class="icon-btn" onclick="toggleModal('memoryModal', true)" title="Yeni Not Ekle">➕</button>
            <button class="icon-btn" onclick="toggleModal('bucketModal', true)" title="Plan Listesi">🎯</button>
        </div>
        <h1 style="margin:0; font-size:26px; font-family:'Georgia',serif;">Bizim Anı Defterimiz ❤️</h1>
        <p style="margin:6px 0 0 0; opacity:0.9; font-size:13px; font-style:italic;">"Bazı hikayeler hiç bitmez, sadece kaldığı yerden sessizce devam eder."</p>
    </div>

    <!-- Modallar -->
    <div id="locationModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--primary); margin:0;">📍 Yeni Konum Ekle</h3>
                <button onclick="toggleModal('locationModal', false)" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text);">&times;</button>
            </div>
            <form action="/konum-ekle" method="POST">
                <input type="text" name="title" placeholder="Mekan Başlığı (Örn: İlk buluşma)" required>
                <input type="text" name="mapsUrl" placeholder="Google Maps Linki" required>
                <textarea name="note" placeholder="Küçük bir not..." rows="2" required></textarea>
                <button type="submit" class="btn-main">Ekle ✨</button>
            </form>
        </div>
    </div>

    <div id="musicSettingsModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--primary); margin:0;">🎶 Arka Plan Şarkısı</h3>
                <button onclick="toggleModal('musicSettingsModal', false)" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text);">&times;</button>
            </div>
            <form action="/muzik-yukle" method="POST" enctype="multipart/form-data">
                <input type="file" name="musicFile" accept="audio/*" required style="background:var(--card-bg); padding:8px;">
                <button type="submit" class="btn-main" style="margin-top:10px;">Şarkıyı Yükle ✨</button>
            </form>
        </div>
    </div>

    <div id="memoryModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--primary); margin:0;">✨ Yeni Paylaşım</h3>
                <button onclick="toggleModal('memoryModal', false)" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text);">&times;</button>
            </div>
            <form action="/ekle" method="POST" enctype="multipart/form-data">
                <select name="category">
                    <option value="Notlar">📌 Notlar</option>
                    <option value="Mekanlar">☕ Mekanlar</option>
                    <option value="Öneriler">💡 Öneriler</option>
                    <option value="Diğer">✨ Diğer</option>
                </select>
                <input type="text" name="title" placeholder="Başlık" required>
                <input type="file" name="image" id="fileInput" accept="image/*,video/*,audio/*" style="background:var(--card-bg); padding:8px;">
                
                <div style="background:var(--input-bg); padding:10px; border-radius:12px; margin-bottom:10px; text-align:center;">
                    <button type="button" id="recBtn" style="background:#ff4d6d; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;" onclick="toggleRecording()">🔴 Ses Kaydet</button>
                    <span id="recStatus" style="font-size:11px; display:block; margin-top:4px;">Kayıt yok</span>
                    <audio id="audioPlayback" controls style="width:100%; margin-top:5px; display:none;"></audio>
                </div>
                <input type="hidden" name="audioData" id="audioData">
                <textarea name="note" placeholder="Notun..." rows="3" required></textarea>
                <button type="submit" class="btn-main">Kaydet ✨</button>
            </form>
        </div>
    </div>

    <div id="bucketModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:var(--primary); margin:0;">🎯 Yapılacaklar Listesi</h3>
                <button onclick="toggleModal('bucketModal', false)" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text);">&times;</button>
            </div>
            <form action="/bucket-ekle" method="POST">
                <input type="text" name="text" placeholder="Yeni fikir ekle..." required>
                <button type="submit" class="btn-main">Listeye Ekle ✨</button>
            </form>
        </div>
    </div>

    <div style="max-width:900px; margin:25px auto; padding:0 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0; font-size:20px;">💌 Paylaşımlarımız</h2>
            <a href="/cikis" style="color:#ff4d6d; font-size:12px; text-decoration:none; font-weight:bold;">Güvenli Çıkış</a>
        </div>
    </div>

    <div id="secret-trigger" onclick="revealSecretPanel()" title="Gizli Alan"></div>
    <div id="secretPanel" class="modal-overlay">
        <div class="modal-content">
            <h3>🔐 Gizli Şifre Yönetimi</h3>
            <div id="auth-step">
                <input type="password" id="masterAdminPass" placeholder="Güvenlik Şifresi (123)...">
                <button type="button" class="btn-main" onclick="verifyMasterPass()">Doğrula</button>
            </div>
            <div id="change-step" style="display:none;">
                <input type="password" id="newAppPassword" placeholder="Yeni Defter Şifresi...">
                <button type="button" class="btn-main" onclick="updatePassword()">Şifreyi Güncelle</button>
            </div>
        </div>
    </div>

    <script>
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            if(!container) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const size = Math.random() * 20 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = duration + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createHeart, 400);

        function toggleModal(id, open) {
            document.getElementById(id).style.display = open ? 'flex' : 'none';
        }

        let clickCount = 0;
        function revealSecretPanel() {
            clickCount++;
            if(clickCount >= 3) { document.getElementById('secretPanel').style.display = 'flex'; clickCount = 0; }
        }
        function verifyMasterPass() {
            if(document.getElementById('masterAdminPass').value === "123") {
                document.getElementById('auth-step').style.display = 'none';
                document.getElementById('change-step').style.display = 'block';
            } else { alert("Hatalı güvenlik şifresi!"); }
        }
        async function updatePassword() {
            const newPassword = document.getElementById('newAppPassword').value;
            const masterKey = document.getElementById('masterAdminPass').value;
            const res = await fetch('/api/update-password', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword, masterKey })
            });
            const data = await res.json();
            if(data.success) { alert(data.message); location.reload(); } else { alert(data.error); }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.cookie = "theme=" + (isDark ? "dark" : "light") + "; max-age=31536000; path=/";
        }

        let mediaRecorder, audioChunks = [], isRecording = false;
        async function toggleRecording() {
            const recBtn = document.getElementById('recBtn'), recStatus = document.getElementById('recStatus'), audioPlayback = document.getElementById('audioPlayback'), audioDataInput = document.getElementById('audioData');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                        reader.onloadend = () => { audioDataInput.value = reader.result; audioPlayback.src = reader.result; audioPlayback.style.display = 'block'; };
                    };
                    mediaRecorder.start(); isRecording = true; recBtn.textContent = "⏹️ Durdur";
                } catch (e) { alert("Mikrofon izni yok!"); }
            } else {
                mediaRecorder.stop(); isRecording = false; recBtn.textContent = "🔴 Kaydet"; recStatus.textContent = "Hazır! ✨";
            }
        }
    </script>
</body>
</html>
